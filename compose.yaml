services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-local}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-umami-db.sh:/docker-entrypoint-initdb.d/init-umami-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-local}']
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # EntryPoints
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.web.http.redirections.entrypoint.permanent=true'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.tls=true'

      # Dynamic config from files
      - '--providers.file.directory=/dynamic'
      - '--providers.file.watch=true'

      # Providers
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'

      # API & Dashboard
      - '--api.dashboard=true'
      - '--api.insecure=false'

      # Observability
      - '--log.level=INFO'
      - '--accesslog=true'
      - '--metrics.prometheus=true'

    # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - 'traefik.enable=true'

      # Dashboard router
      - 'traefik.http.routers.dashboard.rule=Host(`traefik.hedgehog-inc.localhost`)'
      - 'traefik.http.routers.dashboard.entrypoints=websecure'
      - 'traefik.http.routers.dashboard.service=api@internal'
      - 'traefik.http.routers.dashboard.tls=true'

  # Ephemeral init service ensuring umami database exists regardless of volume age
  db-init:
    image: postgres:18
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      PGPASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-local}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tc "SELECT 1 FROM pg_database WHERE datname = 'umami'" | grep -q 1; then
          echo "Database 'umami' does not exist. Creating..."
          psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "CREATE DATABASE umami;"
          echo "Database 'umami' created successfully."
        else
          echo "Database 'umami' already exists."
        fi

  # Umami analytics engine for web and audio metrics (Dev & Prod)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-mysecretpassword}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-hedgehog-umami-secret-key-change-in-prod}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.umami.rule=Host(`${UMAMI_HOST:-umami.hedgehog-inc.localhost}`)'
      - 'traefik.http.routers.umami.entrypoints=websecure'
      - 'traefik.http.routers.umami.tls=true'
      - 'traefik.http.services.umami.loadbalancer.server.port=3000'

volumes:
  pgdata:
