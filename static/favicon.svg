<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- dark background -->
  <rect width="512" height="512" rx="128" fill="#0c0a09"/>
  <!-- glow effect -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" opacity="0.15"/>
  <!-- Hedgehog and waves -->
  <g stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- spines/quills of hedgehog represented as sound waves -->
    <path d="M140 320 C 120 280, 120 220, 160 180 C 200 140, 280 120, 340 160 C 390 190, 400 250, 380 300"/>
    <path d="M190 320 C 180 290, 180 250, 210 220 C 240 190, 280 180, 320 210 C 350 230, 350 270, 340 300"/>
    <!-- headphones -->
    <path d="M256 120 A 136 136 0 0 0 120 256 A 1 1 0 0 0 120 257"/>
    <path d="M256 120 A 136 136 0 0 1 392 256 A 1 1 0 0 1 392 257"/>
    <!-- ear pads -->
    <rect x="100" y="240" width="30" height="70" rx="15" fill="url(#accent)" stroke="none"/>
    <rect x="382" y="240" width="30" height="70" rx="15" fill="url(#accent)" stroke="none"/>
    <!-- bridge of headphones -->
    <path d="M115 240 A 141 141 0 0 1 397 240" stroke-width="12"/>
    <!-- face snout -->
    <path d="M200 320 L 256 360 L 312 320"/>
  </g>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
