services:
  db:
    ports:
      - '127.0.0.1:5432:5432'

  traefik:
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./certs:/certs:ro
      - ./dynamic:/dynamic:ro

  dbgate:
    image: dbgate/dbgate:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      CONNECTIONS: local
      CONNECTION_local_ENGINE: postgres
      CONNECTION_local_SERVER: db
      CONNECTION_local_PORT: 5432
      CONNECTION_local_USER: ${POSTGRES_USER:-root}
      CONNECTION_local_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      CONNECTION_local_DATABASE: ${POSTGRES_DB:-local}
      CONNECTION_local_LABEL: 'PostgreSQL (Local)'
      ENABLE_AUTO_UPDATES: 'false'
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dbgate.rule=Host(`dbgate.hedgehog-inc.localhost`)'
      - 'traefik.http.routers.dbgate.entrypoints=websecure'
      - 'traefik.http.routers.dbgate.tls=true'
      - 'traefik.http.services.dbgate.loadbalancer.server.port=3000'
