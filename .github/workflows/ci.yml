name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
      BETTER_AUTH_ALLOWED_HOSTS: localhost,localhost:4173
      BETTER_AUTH_FALLBACK_URL: http://localhost:4173
      ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm db:migrate
      - run: pnpm db:generate
      - run: git diff --exit-code -- drizzle
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test --workers=1
